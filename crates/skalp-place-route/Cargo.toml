[package]
name = "skalp-place-route"
version = "0.2.0"
edition = "2021"
description = "Native FPGA Place and Route for SKALP"

[features]
default = []
programmer = ["libftd2xx"]
hardware-test = ["programmer"]
# Real Nexus bitstream packing via libprjoxide (ISC). SKALP computes which config
# bits are set; libprjoxide owns the frame container + CRC16 + ECC14. Opt-in so the
# crate still builds without the prjoxide checkout.
nexus-bitstream = ["prjoxide"]

[dependencies]
skalp-lir = { path = "../skalp-lir" }
skalp-frontend = { path = "../skalp-frontend" }
petgraph = "0.6"
indexmap = "2.0"
# Fixed hasher for reproducible map iteration order (see src/collections.rs)
rustc-hash = "1.1"
thiserror = "1.0"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
rand = "0.8"
log = "0.4"

# FTDI programmer support (optional)
libftd2xx = { version = "0.32", optional = true }

# Lattice Nexus bitstream packer (frame container + CRC16/ECC14), ISC-licensed.
# Git dep pinned to the girivs82 fork (LFCPNX linear frame write, LRAM
# unpack fix; upstream lacks both); only compiled when `nexus-bitstream` is enabled.
# (The fuzzed device database is NOT part of the crate — set PRJOXIDE_DB or
# clone prjoxide to ~/src/prjoxide; tests skip gracefully when absent.)
prjoxide = { git = "https://github.com/girivs82/prjoxide", rev = "d734fc3cba1fc161020e7a6a64a88818bf4304ec", optional = true }

[dev-dependencies]
tempfile = "3"
skalp-mir = { path = "../skalp-mir" }
skalp-hir-codegen = { path = "../skalp-hir-codegen" }