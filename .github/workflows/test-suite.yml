name: Test Suite

# Full test run: fmt, clippy, every test target once, doc tests.
# Pull requests run it on Linux stable only (ci.yml); beta and macOS run
# before a release (release.yml) or on demand (Actions -> Full Test Matrix).

on:
  workflow_call:
    inputs:
      os:
        description: JSON list of runner images
        type: string
        default: '["ubuntu-latest"]'
      rust:
        description: JSON list of toolchains
        type: string
        default: '["stable"]'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        rust: ${{ fromJSON(inputs.rust) }}
    steps:
      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/graalvm /usr/local/share/powershell
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --exclude skalp-verify --exclude skalp-formal --lib --tests --bins --all-features -- -D warnings

      # One test invocation with one feature set: every target is compiled
      # once and every test runs once. (Separate per-crate steps with
      # differing features used to rebuild the workspace and rerun the
      # suite about 2.3 times.)
      - name: Run all tests
        run: cargo test --workspace --exclude skalp-verify --exclude skalp-formal --all-targets --all-features --no-fail-fast

      - name: Run doc tests
        run: cargo test --doc --workspace --all-features --exclude skalp --exclude skalp-verify --exclude skalp-formal

      - name: Run verification tests
        if: runner.os == 'macOS'  # z3 only available on macOS
        run: cargo test -p skalp-verify || echo "Skipping verification tests (z3 not installed)"

      - name: Test Summary
        if: always()
        run: |
          echo "Test run completed on ${{ matrix.os }} with Rust ${{ matrix.rust }}"
