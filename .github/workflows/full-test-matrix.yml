name: Full Test Matrix

# The whole test suite on Linux and macOS with stable and beta Rust, plus
# code coverage.
# Runs before every release (release.yml) and on demand from the Actions tab.

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Full matrix
    uses: ./.github/workflows/test-suite.yml
    with:
      os: '["ubuntu-latest", "macos-latest"]'
      rust: '["stable", "beta"]'

  # Informational (never fails the run) and slow, so it runs here rather
  # than on every change.
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true  # a slow or failed coverage run must not block a release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --all-features --workspace --exclude skalp-verify --exclude skalp-formal --timeout 120 --out xml --ignore-tests || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./cobertura.xml
          fail_ci_if_error: false
